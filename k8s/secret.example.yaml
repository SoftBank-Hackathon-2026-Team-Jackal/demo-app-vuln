# chat-secrets: 값은 저장소에 넣지 않는다. 클러스터에 적용할 때 실제 값으로 바꿔서 만든다.
#   kubectl -n chat-source create secret generic chat-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' --from-literal=DB_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
  namespace: chat-source
type: Opaque
stringData:
  DATABASE_URL: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
