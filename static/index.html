<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Beyond Lock-In Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⇄</span>
      <div>
        <h1>Beyond Lock-In Chat</h1>
        <p class="sub">이 대화는 이전이 진행되는 동안에도 끊기지 않습니다</p>
      </div>
    </div>
    <div id="conn" class="conn">
      <span class="pulse" aria-hidden="true"></span>
      <span id="conn-text">연결 중…</span>
    </div>
  </header>

  <main class="layout">
    <section class="chat" aria-label="채팅">
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="composer" class="composer" autocomplete="off">
        <input id="author" class="name" maxlength="40" placeholder="이름" aria-label="이름">
        <input id="body" class="body" maxlength="500" placeholder="메시지를 입력하세요" aria-label="메시지" required>
        <button type="submit" class="send" aria-label="보내기">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 20.5 4 13 21l-2.2-7.3L3 11.5Z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>

    <aside class="panel" aria-label="검증">
      <section class="card">
        <h2>유실 검증 <span class="hint">이 브라우저 기준</span></h2>
        <div class="kpis">
          <div class="kpi"><span id="v-sent" class="num">0</span><span class="label">보냄</span></div>
          <div class="kpi"><span id="v-acked" class="num">0</span><span class="label">저장 확인</span></div>
          <div class="kpi"><span id="v-seen" class="num">0</span><span class="label">수신</span></div>
        </div>
        <dl class="rows">
          <dt>전송 대기</dt><dd id="v-pending">0</dd>
          <dt>재접속</dt><dd id="v-reconnects">0</dd>
        </dl>
        <button id="verify" type="button" class="ghost">DB와 대조하기</button>
        <p id="v-result" class="result"></p>
      </section>

      <section class="card">
        <h2>저장된 DB <span id="total" class="hint"></span></h2>
        <div id="dbbar" class="bar" role="img" aria-label="DB별 메시지 비율"></div>
        <ul id="dblegend" class="legend"></ul>
      </section>

      <section class="card">
        <h2>처리한 앱</h2>
        <ul id="applegend" class="legend"></ul>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
